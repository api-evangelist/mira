name: Mira
description: Mira is a San Francisco-based consumer hardware startup building AI-powered
  smart glasses positioned as an always-on "second brain." Founded in 2024 by Harvard
  builders AnhPhu Nguyen and Caine Ardayfio (rebranded from Halo), the camera-free
  glasses pair a dual-waveguide display, microphone, and iOS companion app to deliver
  live transcription, real-time translation across 60+ languages, hands-free AI assistance,
  and searchable memory of everyday conversations. Mira raised a $6.6M seed round led
  by General Catalyst and began shipping its first devices in January 2026. It is a
  privacy-first consumer wearable with an iOS companion app and does not currently
  expose a public developer API, SDK, or documentation surface.
